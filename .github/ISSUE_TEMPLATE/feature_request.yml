name: 功能建议 / Feature request
description: 描述你的需求与使用场景。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: 请先搜索已有建议，优先说明要解决的问题；实现方式可以一起讨论。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题 / Problem
      description: 谁在什么情况下遇到了什么困难？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为 / Proposed behavior
      description: 你期望软件如何工作？可以附上示例。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案 / Alternatives
  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Context
      description: 兼容性、潜在影响或相关链接；请勿包含敏感信息。
