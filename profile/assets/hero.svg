<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF8FC0"/><stop offset="1" stop-color="#8FD3FF"/></linearGradient>
<pattern id="holes" width="40" height="12" patternUnits="userSpaceOnUse"><rect x="12" y="0" width="16" height="12" rx="3" fill="#1D2650"/></pattern>
<radialGradient id="glowP" cx=".78" cy=".5" r=".55"><stop offset="0" stop-color="#FF8FC0" stop-opacity=".22"/><stop offset="1" stop-color="#FF8FC0" stop-opacity="0"/></radialGradient>
<radialGradient id="glowI" cx=".12" cy=".1" r=".6"><stop offset="0" stop-color="#8FD3FF" stop-opacity=".16"/><stop offset="1" stop-color="#8FD3FF" stop-opacity="0"/></radialGradient>
<linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232E5E"/><stop offset="1" stop-color="#101732"/></linearGradient>
<radialGradient id="lens" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#C9ECFF"/><stop offset=".35" stop-color="#4FA8E8"/><stop offset=".75" stop-color="#1A2A6B"/><stop offset="1" stop-color="#0A0F28"/></radialGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#26305F"/></pattern>
<style>@keyframes roll{to{transform:translateX(40px)}}@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes flash{0%,91%,100%{opacity:0}93%{opacity:.9}97%{opacity:0}}
@keyframes lock{0%,18%{stroke:#FF8FC0;transform:scale(1.35)}30%,100%{stroke:#7CF0B5;transform:scale(1)}}
@keyframes lockT{0%,18%{opacity:0}30%,92%{opacity:1}100%{opacity:0}}
@keyframes rec{50%{opacity:.25}}
@keyframes glint{0%,100%{transform:translate(0,0);opacity:.9}50%{transform:translate(6px,4px);opacity:.5}}
@keyframes drift{50%{transform:translateY(-8px)}}
</style>
</defs>
<rect width="1200" height="440" rx="22" fill="url(#bg)"/>
<rect width="1200" height="440" rx="22" fill="url(#dots)" opacity=".7"/>
<rect width="1200" height="440" rx="22" fill="url(#glowP)"/>
<rect width="1200" height="440" rx="22" fill="url(#glowI)"/>
